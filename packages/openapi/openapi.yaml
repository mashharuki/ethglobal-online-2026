openapi: 3.1.0
info:
  title: TrueCollective Access Gateway API
  version: 0.2.0
  description: |
    Access Gateway HTTP API for TrueCollective (transfer-coupled rights runtime on Hedera Testnet).
    This file is the single source of truth (FR-029): `openapi-typescript` generates `src/types.ts`
    which `apps/gateway` (handler I/O), `apps/web` and `apps/agent` (clients) import, so front/back
    drift is a `tsc` error. Human-readable rationale lives in
    `specs/001-rights-runtime-mvp/contracts/gateway-api.md`; when they disagree this file wins.

    Every authorization decision is made by the gateway reading Hedera state (`ownerOf`,
    `accessEpoch`, `receiptStatus`, `hasValidConsumption`) at request time (constitution II).
    Durable Objects / Postgres / KV are concurrency control, key shares and audit only.

    Errors are always `{ code, message, detail? }` with `code` from `ErrorCode`
    (mirrored from `packages/shared/src/errors.ts`; `pnpm --filter @truenft/openapi sync-errors`).
servers:
  - url: http://localhost:8787
    description: wrangler dev
  - url: "{gatewayUrl}"
    description: Deployed Cloudflare Worker (set GATEWAY_URL)
    variables:
      gatewayUrl:
        default: https://gateway.example.workers.dev
tags:
  - name: ops
    description: Liveness / operations
  - name: discovery
    description: Public discovery / preview (FR-019, FR-020). Never an authorization source.
  - name: owner
    description: Owner (free) path - User Story 1 (FR-002 / FR-003 / FR-024)
  - name: x402
    description: Buyer path - x402 exact payment in native HBAR (FR-004..FR-009)
  - name: keygate
    description: KeyGate share_G release (FR-015 / FR-016)
  - name: graph
    description: Rights Graph proxy (FR-020)
  - name: audit
    description: Audit log (FR-023)
  - name: admin
    description: Creator / admin operations (emergency revocation)
  - name: mcp
    description: MCP server for AI clients (FR-026, Streamable HTTP)
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [ops]
      responses:
        "200":
          description: Gateway is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /assets:
    get:
      operationId: listAssets
      summary: List discoverable assets (subgraph + expanded manifests)
      tags: [discovery]
      responses:
        "200":
          description: Asset summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetSummary"
        "429":
          $ref: "#/components/responses/RateLimited"

  /assets/{assetId}/preview:
    get:
      operationId: getAssetPreview
      summary: Public preview body (no authorization)
      tags: [discovery]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Preview document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDocument"
        "302":
          description: Redirect to the preview URI
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /owner/challenge:
    post:
      operationId: createOwnerChallenge
      summary: Issue a nonce-bound OwnerAuthChallenge (FR-024)
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerChallengeRequest"
      responses:
        "200":
          description: Typed data to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /owner/keygate:
    post:
      operationId: ownerKeygate
      summary: Owner path share_G release (ownerOf / accessEpoch read on-chain every call)
      description: |
        Server steps (gateway-api.md): nonce check -> manifest lookup by assetId (tokenId is derived
        server-side, R-11) -> authSig recovery == wallet and bound assetId -> EOA check ->
        `eth_call ownerOf(tokenId) == wallet` -> accessEpoch -> reuse or compute blindedU (keyGateSig
        required on first access only, R-1a) -> decrypt share_G -> issue ownerSession -> audit.
        When an `ownerSession` is presented and its `accessEpochAtGrant` differs from the live
        accessEpoch the answer is OWNER_EPOCH_MISMATCH (checked before ownerOf).
      tags: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerKeygateRequest"
      responses:
        "200":
          description: share_G released to the current owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerKeygateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /assets/{assetId}/paid:
    get:
      operationId: getPaymentRequirements
      summary: x402 payment requirements (HTTP 402 when unpaid)
      tags: [x402]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "402":
          description: Payment required - x402 `accepts` for native HBAR on hedera:testnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: settlePayment
      summary: Settle an x402 payment and issue the Rights Receipt (1 Hedera tx)
      description: |
        `payment_id` is derived by the gateway from the keccak of the buyer-signed payload
        (R-10). Idempotent per payment_id: an identical purchaseRequestHash returns the stored
        response; a different one is PAYMENT_ID_PAYLOAD_CONFLICT; an in-flight settlement is
        SETTLEMENT_IN_PROGRESS after a short poll.
      tags: [x402]
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/XPayment"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleRequest"
      responses:
        "200":
          description: Receipt issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          description: UNDERPAYMENT or missing/invalid payment header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /assets/{assetId}/finalize:
    post:
      operationId: finalizePayment
      summary: R-2a fallback rail only - permissionless finalize of a payFor deposit
      tags: [x402]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeRequest"
      responses:
        "200":
          description: Receipt issued from the committed deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "402":
          description: UNDERPAYMENT (deposit does not match price)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /keygate/challenge:
    post:
      operationId: createLicenseeChallenge
      summary: Issue a nonce-bound LicenseeAuthChallenge (R-1a)
      tags: [keygate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicenseeChallengeRequest"
      responses:
        "200":
          description: Typed data to sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /keygate/share:
    post:
      operationId: keygateShare
      summary: KeyGate share_G release (owner or licensee path)
      description: |
        Licensee path runs inside the ReceiptLock Durable Object for the receiptHash: nonce +
        authSig (LICENSEE_MISMATCH) -> receiptStatus read on-chain (CHAIN_ID / RESOURCE_HASH /
        POLICY_HASH checks) -> SELECT ... FOR UPDATE -> useIndex from the DO counter (R-3a) ->
        consume via OperatorTxQueue -> settle-before-release of share_G. Owner path is identical
        to /owner/keygate (no consume).
      tags: [keygate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeygateShareRequest"
      responses:
        "200":
          description: share_G released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeygateShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /graph:
    post:
      operationId: graphQuery
      summary: Rights Graph GraphQL pass-through (discovery / audit only, never authorization)
      tags: [graph]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphQLRequest"
      responses:
        "200":
          description: GraphQL response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphQLResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Subgraph unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit:
    get:
      operationId: listAudit
      summary: Audit log excerpt (allow / deny decisions, FR-023)
      tags: [audit]
      parameters:
        - name: assetId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Bytes32"
        - name: since
          in: query
          required: false
          description: Unix seconds
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "429":
          $ref: "#/components/responses/RateLimited"

  /assets/{assetId}/bump-license-epoch:
    post:
      operationId: bumpLicenseEpoch
      summary: Creator-signed emergency revocation (License Epoch +1)
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BumpLicenseEpochRequest"
      responses:
        "200":
          description: License epoch bumped on-chain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BumpLicenseEpochResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mcp:
    post:
      operationId: mcpPost
      summary: MCP Streamable HTTP endpoint (JSON-RPC 2.0) - tools discover_assets / buy_access / decrypt_content
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/McpSessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcIncoming"
      responses:
        "200":
          description: JSON-RPC response (or SSE stream)
          headers:
            Mcp-Session-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcOutgoing"
            text/event-stream:
              schema:
                type: string
        "202":
          description: Accepted (notification / response without body)
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: mcpStream
      summary: MCP server-to-client SSE stream
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/McpSessionId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "405":
          description: Stream not supported by this server configuration
    delete:
      operationId: mcpEndSession
      summary: Terminate an MCP session
      tags: [mcp]
      parameters:
        - $ref: "#/components/parameters/McpSessionId"
      responses:
        "200":
          description: Session terminated
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Bytes32"
    XPayment:
      name: X-PAYMENT
      in: header
      required: false
      description: x402 payment payload (base64 JSON) produced by the client scheme
      schema:
        type: string
    McpSessionId:
      name: Mcp-Session-Id
      in: header
      required: false
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request or MANIFEST_SCHEMA_INVALID / CONTRACT_WALLET_UNSUPPORTED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: NONCE_INVALID_OR_EXPIRED / SIGNATURE_INVALID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authorization denied (see ErrorCode)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown asset / receipt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: RECEIPT_ALREADY_CONSUMED / PAYMENT_ID_PAYLOAD_CONFLICT / SETTLEMENT_IN_PROGRESS / SETTLEMENT_NOT_FINALIZED / COMMITTED_PARAMS_MISMATCH
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: RATE_LIMITED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Bytes32:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
    HexBytes:
      type: string
      description: 0x-prefixed byte string (even number of hex digits, may be empty)
      pattern: "^0x(?:[0-9a-fA-F]{2})*$"
    Signature:
      type: string
      description: 65-byte secp256k1 signature (r || s || v) as 0x hex
      pattern: "^0x[0-9a-fA-F]{130}$"
    UintString:
      type: string
      description: Unsigned integer as decimal string (uint256-safe)
      pattern: "^[0-9]+$"
    Weibar:
      type: string
      description: Native HBAR amount in weibar (10^18 = 1 HBAR), multiple of 10^10
      pattern: "^[0-9]+$"

    Health:
      type: object
      required: [ok, chainId]
      properties:
        ok:
          type: boolean
        chainId:
          type: integer
          description: Hedera chainId the gateway authorizes against (296 = testnet)

    # sync-error-codes:start (generated from packages/shared/src/errors.ts - do not edit by hand)
    ErrorCode:
      type: string
      description: |
        Stable public contract. The canonical list lives in `packages/shared/src/errors.ts`;
        this enum only mirrors it (T039 verifies the two stay identical). Do not rename values.
      enum:
        - RECEIPT_ALREADY_CONSUMED
        - RESOURCE_HASH_MISMATCH
        - POLICY_HASH_MISMATCH
        - CHAIN_ID_MISMATCH
        - LICENSEE_MISMATCH
        - RECEIPT_EXPIRED
        - USE_LIMIT_EXCEEDED
        - UNDERPAYMENT
        - PAYMENT_ID_PAYLOAD_CONFLICT
        - OWNER_EPOCH_MISMATCH
        - LICENSE_INVALIDATED_ON_TRANSFER
        - LICENSE_EPOCH_MISMATCH
        - NONCE_INVALID_OR_EXPIRED
        - SIGNATURE_INVALID
        - NOT_CURRENT_OWNER
        - CONTRACT_WALLET_UNSUPPORTED
        - CONDITIONS_HASH_MISMATCH
        - SETTLEMENT_NOT_FINALIZED
        - MANIFEST_SCHEMA_INVALID
        - RATE_LIMITED
        - POLICY_CONTENT_MISMATCH
        - EXPIRY_MISMATCH
        - COMMITTED_PARAMS_MISMATCH
        - MCP_SESSION_MISMATCH
        - SETTLEMENT_IN_PROGRESS
        - NOT_AUTHORIZED
    # sync-error-codes:end

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        detail:
          type: object
          additionalProperties: true

    Permissions:
      type: object
      required: [commercialUse, aiTraining, derivativeGeneration]
      properties:
        commercialUse:
          type: boolean
        aiTraining:
          type: boolean
        derivativeGeneration:
          type: boolean

    TransferMode:
      type: string
      enum: [SURVIVE_TRANSFER, INVALIDATE_ON_TRANSFER]

    PaidAccess:
      type: object
      required: [price, durationSec, maxUses]
      properties:
        price:
          $ref: "#/components/schemas/Weibar"
        durationSec:
          type: integer
          minimum: 1
        maxUses:
          type: integer
          minimum: 1
          maximum: 4294967295

    RightsManifest:
      type: object
      description: Mirrors specs/.../contracts/rights-manifest.schema.json (zod in packages/shared)
      required:
        - schemaVersion
        - assetId
        - nftContract
        - tokenId
        - previewURI
        - encryptedContentURI
        - contentHash
        - keyGate
        - ownerAccess
        - paidAccess
        - permissions
        - transferMode
        - revenueSplit
      properties:
        schemaVersion:
          type: string
          enum: ["1.0"]
        assetId:
          $ref: "#/components/schemas/Bytes32"
        nftContract:
          $ref: "#/components/schemas/Address"
        tokenId:
          $ref: "#/components/schemas/UintString"
        previewURI:
          type: string
          format: uri
        encryptedContentURI:
          type: string
          format: uri
        contentHash:
          $ref: "#/components/schemas/Bytes32"
        keyGate:
          type: object
          required: [scheme, keyGateVersion, conditionsHash, ownerCondition, licenseCondition]
          properties:
            scheme:
              type: string
              enum: [xor-2share]
            keyGateVersion:
              type: integer
              enum: [1]
            conditionsHash:
              $ref: "#/components/schemas/Bytes32"
            ownerCondition:
              type: string
            licenseCondition:
              type: string
        ownerAccess:
          type: object
          required: [price, durationSec]
          properties:
            price:
              type: string
              enum: ["0"]
            durationSec:
              type: integer
              minimum: 1
        paidAccess:
          $ref: "#/components/schemas/PaidAccess"
        permissions:
          $ref: "#/components/schemas/Permissions"
        transferMode:
          $ref: "#/components/schemas/TransferMode"
        revenueSplit:
          type: object
          required: [creatorBps, ownerBps]
          properties:
            creatorBps:
              type: integer
              minimum: 0
              maximum: 10000
            ownerBps:
              type: integer
              minimum: 0
              maximum: 10000

    AssetSummary:
      type: object
      required: [assetId, tokenId, nftContract, previewURI, manifestURI, paidAccess, transferMode, permissions]
      properties:
        assetId:
          $ref: "#/components/schemas/Bytes32"
        tokenId:
          $ref: "#/components/schemas/UintString"
        nftContract:
          $ref: "#/components/schemas/Address"
        owner:
          $ref: "#/components/schemas/Address"
        creator:
          $ref: "#/components/schemas/Address"
        previewURI:
          type: string
          format: uri
        manifestURI:
          type: string
          format: uri
        paidAccess:
          $ref: "#/components/schemas/PaidAccess"
        transferMode:
          $ref: "#/components/schemas/TransferMode"
        permissions:
          $ref: "#/components/schemas/Permissions"
        accessEpoch:
          type: integer
          description: Live Owner Epoch (informational)
        licenseEpoch:
          type: integer
          description: Live License Epoch (informational)

    PreviewDocument:
      type: object
      additionalProperties: true

    TypedData:
      type: object
      description: EIP-712 typed data payload (domain / types / primaryType / message)
      required: [domain, types, primaryType, message]
      properties:
        domain:
          type: object
          required: [name, version, chainId, verifyingContract]
          properties:
            name:
              type: string
            version:
              type: string
            chainId:
              type: integer
            verifyingContract:
              $ref: "#/components/schemas/Address"
        types:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
        primaryType:
          type: string
        message:
          type: object
          additionalProperties: true

    ChallengeResponse:
      type: object
      required: [typedData, nonce, expiresAt]
      properties:
        typedData:
          $ref: "#/components/schemas/TypedData"
        nonce:
          $ref: "#/components/schemas/Bytes32"
        expiresAt:
          type: integer
          description: Unix seconds (issued + 120s)

    OwnerChallengeRequest:
      type: object
      required: [assetId, wallet]
      properties:
        assetId:
          $ref: "#/components/schemas/Bytes32"
        wallet:
          $ref: "#/components/schemas/Address"
        purpose:
          type: string
          description: |
            `owner-access` (default) issues an OwnerAuthChallenge for /owner/keygate and
            /keygate/share. `bump-license-epoch` issues a RevocationChallenge{nonce, chainId,
            tokenId, assetId, action, expiresAt} whose signature is ONLY accepted by
            /assets/{assetId}/bump-license-epoch - an access signature can never authorize a
            revocation and vice versa.
          enum: [owner-access, bump-license-epoch]
          default: owner-access

    OwnerSession:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          $ref: "#/components/schemas/HexBytes"
        expiresAt:
          type: integer

    OwnerKeygateRequest:
      type: object
      required: [assetId, wallet, authSig]
      properties:
        assetId:
          $ref: "#/components/schemas/Bytes32"
        wallet:
          $ref: "#/components/schemas/Address"
        authSig:
          $ref: "#/components/schemas/Signature"
          description: Signature over OwnerAuthChallenge{nonce, chainId, tokenId, assetId, expiresAt}
        keyGateSig:
          $ref: "#/components/schemas/Signature"
          description: First access only - signature over KeyGateChallenge{assetId, "owner", 0x0}; never used for authentication (R-1a)
        ownerSession:
          type: string
          description: Previously issued ownerSession.token (used only to select OWNER_EPOCH_MISMATCH over NOT_CURRENT_OWNER)

    OwnerKeygateResponse:
      type: object
      required: [shareG, blindedU, accessEpochAtGrant, ownerSession, encryptedContentURI, contentHash]
      properties:
        shareG:
          $ref: "#/components/schemas/Bytes32"
        blindedU:
          $ref: "#/components/schemas/Bytes32"
        accessEpochAtGrant:
          type: integer
        ownerSession:
          $ref: "#/components/schemas/OwnerSession"
        encryptedContentURI:
          type: string
          format: uri
        contentHash:
          $ref: "#/components/schemas/Bytes32"

    ReceiptQuote:
      type: object
      description: |
        The receipt fields the gateway fixes at quote (402) time. The remaining fields
        (licensee, paymentId, nonce, purchaseRequestHash) are bound at settlement from the
        buyer-signed payload; the buyer does not choose any of these values.
      additionalProperties: false
      required:
        - chainId
        - verifyingContract
        - nftContract
        - tokenId
        - resourceHash
        - policyHash
        - licenseEpoch
        - ownerEpochAtIssue
        - permittedAction
        - transferMode
        - maxUses
        - issuedAt
        - expiresAt
        - priceTinybar
        - creatorBps
        - ownerBps
      properties:
        chainId:
          type: integer
        verifyingContract:
          $ref: "#/components/schemas/Address"
        nftContract:
          $ref: "#/components/schemas/Address"
        tokenId:
          $ref: "#/components/schemas/UintString"
        resourceHash:
          $ref: "#/components/schemas/Bytes32"
        policyHash:
          $ref: "#/components/schemas/Bytes32"
        licenseEpoch:
          $ref: "#/components/schemas/UintString"
        ownerEpochAtIssue:
          $ref: "#/components/schemas/UintString"
        permittedAction:
          type: integer
          minimum: 0
          maximum: 255
        transferMode:
          type: integer
          enum: [0, 1]
        maxUses:
          type: integer
          minimum: 1
        issuedAt:
          type: integer
        expiresAt:
          type: integer
        priceTinybar:
          $ref: "#/components/schemas/UintString"
        creatorBps:
          type: integer
        ownerBps:
          type: integer

    PaymentAccept:
      type: object
      required: [scheme, network, asset, amount, maxAmountRequired, payTo, resource]
      properties:
        scheme:
          type: string
          enum: [exact]
        network:
          type: string
          enum: ["hedera:testnet"]
        asset:
          type: string
          description: Native asset marker fixed by the day1 probe (T020)
        amount:
          $ref: "#/components/schemas/UintString"
          description: x402 v2 amount in the asset's smallest unit - tinybar for native HBAR (what @x402/hedera transfers)
        maxAmountRequired:
          $ref: "#/components/schemas/Weibar"
        payTo:
          type: string
          description: RightsRegistry (primary/fallback) or the gateway settlement account (custodial rail)
        resource:
          type: string
        description:
          type: string
        maxTimeoutSeconds:
          type: integer
        extra:
          type: object
          properties:
            settlementMode:
              type: string
              enum: [primary, fallback, custodial]
            contractCall:
              type: string
            value:
              $ref: "#/components/schemas/Weibar"
            feePayer:
              type: string
            receiptQuote:
              $ref: "#/components/schemas/ReceiptQuote"
          additionalProperties: true

    PaymentRequired:
      type: object
      required: [x402Version, accepts]
      properties:
        x402Version:
          type: integer
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/PaymentAccept"
        error:
          type: string
        manifest:
          $ref: "#/components/schemas/RightsManifest"

    SettleRequest:
      type: object
      description: Optional JSON body when the payment payload is not carried in X-PAYMENT
      properties:
        paymentPayload:
          type: string
          description: Same encoding as the X-PAYMENT header
        licensee:
          $ref: "#/components/schemas/Address"

    RightsReceipt:
      type: object
      description: The 17 EIP-712 fields; hashStruct(this) is receiptHash (constitution V)
      required:
        - chainId
        - verifyingContract
        - nftContract
        - tokenId
        - resourceHash
        - policyHash
        - licenseEpoch
        - ownerEpochAtIssue
        - licensee
        - permittedAction
        - transferMode
        - maxUses
        - expiresAt
        - purchaseRequestHash
        - paymentId
        - nonce
        - issuedAt
      properties:
        chainId:
          type: integer
        verifyingContract:
          $ref: "#/components/schemas/Address"
        nftContract:
          $ref: "#/components/schemas/Address"
        tokenId:
          $ref: "#/components/schemas/UintString"
        resourceHash:
          $ref: "#/components/schemas/Bytes32"
        policyHash:
          $ref: "#/components/schemas/Bytes32"
        licenseEpoch:
          $ref: "#/components/schemas/UintString"
        ownerEpochAtIssue:
          $ref: "#/components/schemas/UintString"
        licensee:
          $ref: "#/components/schemas/Address"
        permittedAction:
          type: integer
          minimum: 0
          maximum: 255
        transferMode:
          type: integer
          enum: [0, 1]
        maxUses:
          type: integer
        expiresAt:
          type: integer
        purchaseRequestHash:
          $ref: "#/components/schemas/Bytes32"
        paymentId:
          $ref: "#/components/schemas/Bytes32"
        nonce:
          $ref: "#/components/schemas/Bytes32"
        issuedAt:
          type: integer

    SettleResponse:
      type: object
      required: [receiptHash, receipt, serverSignature, onchainTx, maxUses, expiresAt]
      properties:
        receiptHash:
          $ref: "#/components/schemas/Bytes32"
        receipt:
          $ref: "#/components/schemas/RightsReceipt"
        serverSignature:
          $ref: "#/components/schemas/Signature"
        onchainTx:
          type: string
          description: Hedera tx hash / id of the settlement
        maxUses:
          type: integer
        expiresAt:
          type: integer
        settlementMode:
          type: string
          enum: [primary, fallback, custodial]

    FinalizeRequest:
      type: object
      required: [paymentId, receipt]
      properties:
        paymentId:
          $ref: "#/components/schemas/Bytes32"
        receipt:
          $ref: "#/components/schemas/RightsReceipt"
        price:
          $ref: "#/components/schemas/UintString"
          description: tinybar
        creatorBps:
          type: integer
        ownerBps:
          type: integer

    LicenseeChallengeRequest:
      type: object
      required: [receiptHash, wallet]
      properties:
        receiptHash:
          $ref: "#/components/schemas/Bytes32"
        wallet:
          $ref: "#/components/schemas/Address"

    KeygateShareRequest:
      oneOf:
        - $ref: "#/components/schemas/KeygateShareOwnerRequest"
        - $ref: "#/components/schemas/KeygateShareLicenseeRequest"
      discriminator:
        propertyName: path
        mapping:
          owner: "#/components/schemas/KeygateShareOwnerRequest"
          licensee: "#/components/schemas/KeygateShareLicenseeRequest"

    KeygateShareOwnerRequest:
      type: object
      required: [path, assetId, wallet, authSig]
      properties:
        path:
          type: string
          enum: [owner]
        assetId:
          $ref: "#/components/schemas/Bytes32"
        wallet:
          $ref: "#/components/schemas/Address"
        authSig:
          $ref: "#/components/schemas/Signature"
        keyGateSig:
          $ref: "#/components/schemas/Signature"
        ownerSession:
          type: string

    KeygateShareLicenseeRequest:
      type: object
      required: [path, assetId, receiptHash, authSig]
      properties:
        path:
          type: string
          enum: [licensee]
        assetId:
          $ref: "#/components/schemas/Bytes32"
        receiptHash:
          $ref: "#/components/schemas/Bytes32"
        authSig:
          $ref: "#/components/schemas/Signature"
          description: Signature over LicenseeAuthChallenge{nonce, chainId, receiptHash, expiresAt}
        keyGateSig:
          $ref: "#/components/schemas/Signature"
          description: First access only - KeyGateChallenge{assetId, "licensee", receiptHash}

    KeygateShareResponse:
      oneOf:
        - $ref: "#/components/schemas/KeygateShareOwnerResponse"
        - $ref: "#/components/schemas/KeygateShareLicenseeResponse"
      discriminator:
        propertyName: path
        mapping:
          owner: "#/components/schemas/KeygateShareOwnerResponse"
          licensee: "#/components/schemas/KeygateShareLicenseeResponse"

    KeygateShareOwnerResponse:
      type: object
      description: Identical payload to /owner/keygate plus the `path` discriminator
      required: [path, shareG, blindedU, accessEpochAtGrant, ownerSession, encryptedContentURI, contentHash]
      properties:
        path:
          type: string
          enum: [owner]
        shareG:
          $ref: "#/components/schemas/Bytes32"
        blindedU:
          $ref: "#/components/schemas/Bytes32"
        accessEpochAtGrant:
          type: integer
        ownerSession:
          $ref: "#/components/schemas/OwnerSession"
        encryptedContentURI:
          type: string
          format: uri
        contentHash:
          $ref: "#/components/schemas/Bytes32"

    KeygateShareLicenseeResponse:
      type: object
      required: [path, shareG, blindedU, useIndex, onchainTx, encryptedContentURI, contentHash]
      properties:
        path:
          type: string
          enum: [licensee]
        shareG:
          $ref: "#/components/schemas/Bytes32"
        blindedU:
          $ref: "#/components/schemas/Bytes32"
        useIndex:
          type: integer
          minimum: 0
        onchainTx:
          type: string
          description: The consume tx (settle-before-release)
        encryptedContentURI:
          type: string
          format: uri
        contentHash:
          $ref: "#/components/schemas/Bytes32"

    GraphQLRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
        operationName:
          type: string

    GraphQLResponse:
      type: object
      properties:
        data:
          type: [object, "null"]
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    AuditEntry:
      type: object
      description: |
        Strict allowlist (additionalProperties: false) so signatures / key shares / session tokens
        can never appear in an audit response (R-1a, FR-023).
      additionalProperties: false
      required: [id, at, action, outcome]
      properties:
        id:
          type: string
        at:
          type: integer
          description: Unix seconds
        action:
          type: string
          enum: [owner_keygate, x402_settle, consume, claim, policy_update, bump_license_epoch, mcp_buy_access, mcp_decrypt_content]
        outcome:
          type: string
          enum: [allow, deny]
        code:
          $ref: "#/components/schemas/ErrorCode"
        assetId:
          $ref: "#/components/schemas/Bytes32"
        subject:
          type: string
          description: Wallet address or MCP session id
        onchainRef:
          type: string
        detail:
          $ref: "#/components/schemas/AuditDetail"

    AuditDetail:
      type: object
      additionalProperties: false
      properties:
        tokenId:
          $ref: "#/components/schemas/UintString"
        receiptHash:
          $ref: "#/components/schemas/Bytes32"
        paymentId:
          $ref: "#/components/schemas/Bytes32"
        useIndex:
          type: integer
        sessionEpoch:
          type: integer
        currentEpoch:
          type: integer
        licenseEpoch:
          type: integer
        newEpoch:
          type: integer
        amountTinybar:
          $ref: "#/components/schemas/UintString"

    BumpLicenseEpochRequest:
      type: object
      required: [wallet, revocationSig]
      properties:
        wallet:
          $ref: "#/components/schemas/Address"
        revocationSig:
          $ref: "#/components/schemas/Signature"
          description: |
            Creator signature over RevocationChallenge{nonce, chainId, tokenId, assetId,
            action = "bump-license-epoch", expiresAt} obtained from /owner/challenge with
            purpose=bump-license-epoch. OwnerAuthChallenge signatures are rejected here
            (SIGNATURE_INVALID): the action is part of the signed struct.

    BumpLicenseEpochResponse:
      type: object
      required: [tokenId, newEpoch, onchainTx]
      properties:
        tokenId:
          $ref: "#/components/schemas/UintString"
        newEpoch:
          type: integer
        onchainTx:
          type: string

    JsonRpcId:
      oneOf:
        - type: string
        - type: integer

    JsonRpcRequest:
      type: object
      required: [jsonrpc, id, method]
      additionalProperties: false
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          $ref: "#/components/schemas/JsonRpcId"
        method:
          type: string
        params:
          type: object
          additionalProperties: true

    JsonRpcNotification:
      type: object
      required: [jsonrpc, method]
      additionalProperties: false
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
        params:
          type: object
          additionalProperties: true

    JsonRpcSuccess:
      type: object
      required: [jsonrpc, id, result]
      additionalProperties: false
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          $ref: "#/components/schemas/JsonRpcId"
        result:
          type: object
          additionalProperties: true

    JsonRpcError:
      type: object
      required: [jsonrpc, id, error]
      additionalProperties: false
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          $ref: "#/components/schemas/JsonRpcId"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              description: "For tool errors: `{ code: ErrorCode, ... }`"
              type: object
              additionalProperties: true

    JsonRpcIncoming:
      description: What a client may POST (request or notification)
      oneOf:
        - $ref: "#/components/schemas/JsonRpcRequest"
        - $ref: "#/components/schemas/JsonRpcNotification"

    JsonRpcOutgoing:
      description: What the server answers (success or error)
      oneOf:
        - $ref: "#/components/schemas/JsonRpcSuccess"
        - $ref: "#/components/schemas/JsonRpcError"

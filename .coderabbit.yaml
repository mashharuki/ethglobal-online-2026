# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit configuration for TrueCollective (ETHGlobal ETHOnline 2026).
# pnpm monorepo: apps/gateway (Hono on Cloudflare Workers + MCP server), apps/web
# (Vite/React + Privy), apps/contracts (Hardhat 3 / Hedera), apps/subgraph, apps/cdk,
# apps/e2e, apps/agent, packages/shared, packages/openapi.
# Root tooling is Biome (format/lint) + knip (unused code) + TypeScript strict.

language: "ja"
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false

  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  review_status: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches:
      - "main"

  # Include real source; exclude generated/vendored/build output.
  path_filters:
    - "**/*"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/.wrangler/**"
    - "!**/.expo/**"
    - "!**/ios/**"
    - "!**/android/**"
    - "!**/*.lock"
    - "!pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/*.log"
    - "!.git/**"
    - "!.serena/**"
    - "!.codegraph/**"

  path_instructions:
    - path: "apps/gateway/**/*.ts"
      instructions: >
        Cloudflare Workers + Hono Access Gateway. Authorization must be re-derived
        from on-chain reads (ownerOf / accessEpoch / receiptStatus) on every
        request; the subgraph cache is never an authorization source. Key
        material (share_U, receipt signer, operator key) comes from Workers
        Secrets, never from code or logs. New bindings (KV / DO / Hyperdrive /
        vars) must be reflected in wrangler.toml and CONFIG.md.

    - path: "apps/web/**/*.{ts,tsx}"
      instructions: >
        Vite + React + Privy embedded wallet. Decryption happens client-side
        only; content keys and key shares must be wiped after use and never
        logged. Gateway calls go through src/api/client.ts (openapi-fetch typed
        by packages/openapi), never hand-written fetch shapes.

    - path: "apps/contracts/**/*.sol"
      instructions: >
        Solidity 0.8.34 on Hedera Testnet. accessEpoch may only change in
        RightsNFT._update; settleAndIssue must keep the tinybar accounting
        (msg.value / 1e10) and creator-only dust rule; custom error names must
        match packages/shared error codes.

    - path: "apps/e2e/**/*.ts"
      instructions: >
        Live-network specs must skip (never pass) without their targets, and
        latency metrics must be recorded only after the scenario's own
        assertions passed.

    - path: "**/*.{test,spec}.{ts,tsx}"
      instructions: >
        Follow .claude/rules/testing.md: cover happy path, edge cases, and
        error cases; don't test implementation details or third-party
        internals; use factory functions for test data, not raw objects.

    - path: "**/*.{ts,tsx}"
      instructions: >
        Follow .claude/rules/code-style.md: prefer const over let, early
        returns over nesting, explicit return types on exported functions,
        no unjustified `any`, Result pattern for expected failures, never
        swallow errors silently.

    - path: ".claude/**/*"
      instructions: >
        Claude Code agent configuration (rules/skills), not application
        code — review for internal consistency and clarity, not runtime
        correctness.

    - path: ".kiro/**/*"
      instructions: >
        Kiro-style spec-driven development artifacts. When present, check
        alignment between requirements.md, design.md, and tasks.md within
        the same spec.

  tools:
    biome:
      enabled: true
    gitleaks:
      enabled: true
    osv-scanner:
      enabled: true
    semgrep:
      enabled: true
    github-checks:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".claude/rules/*.md"
  learnings:
    scope: auto
  pull_requests:
    scope: auto

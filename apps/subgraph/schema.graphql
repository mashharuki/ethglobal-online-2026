# Rights Graph - discovery / audit only. Never an authorization source (FR-020, constitution II).
# Spec: specs/001-rights-runtime-mvp/contracts/subgraph-schema.md
#
# Counters that are uint32 / uint256 on-chain are BigInt here (GraphQL Int is signed 32-bit).
# Entities observed before their originating event (startBlock after mint, consume before an
# indexed issue) are stored with `hydrated` / `complete` = false instead of invented values.

"""
One RightsNFT token. `accessEpoch` mirrors the on-chain Owner Epoch (read back via
`accessEpoch(tokenId)` on every transfer, falling back to +1 arithmetic); `licenseEpoch`
mirrors the latest LicenseEpochBumped. Both are informational here.
"""
type RightsToken @entity(immutable: false) {
  "tokenId"
  id: ID!
  "false until creator / policyHash / manifestURI were read from the contract"
  hydrated: Boolean!
  owner: Owner!
  creator: Bytes!
  accessEpoch: BigInt!
  policyHash: Bytes!
  manifestURI: String!
  licenseEpoch: BigInt!
  transfers: [TransferEvent!]! @derivedFrom(field: "token")
  receipts: [Receipt!]! @derivedFrom(field: "token")
  allocations: [RevenueAllocation!]! @derivedFrom(field: "token")
  "Sum of creatorAmount + ownerAmount over all allocations (tinybar)"
  totalRevenue: BigInt!
}

type Owner @entity(immutable: false) {
  "address"
  id: ID!
  tokens: [RightsToken!]! @derivedFrom(field: "owner")
}

type TransferEvent @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  token: RightsToken!
  from: Bytes!
  to: Bytes!
  "accessEpoch after this transfer"
  accessEpoch: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Receipt @entity(immutable: false) {
  "receiptHash"
  id: ID!
  "false when only consumptions were observed (issued before startBlock)"
  complete: Boolean!
  token: RightsToken
  licensee: Bytes
  policyHash: Bytes
  "0 SURVIVE_TRANSFER / 1 INVALIDATE_ON_TRANSFER; null when receiptStatus() could not be read"
  transferMode: Int
  maxUses: BigInt
  expiresAt: BigInt
  "Number of Consumption entities"
  usedCount: BigInt!
  issuedAtBlock: BigInt
  consumptions: [Consumption!]! @derivedFrom(field: "receipt")
}

type Consumption @entity(immutable: true) {
  "receiptHash-useIndex"
  id: ID!
  receipt: Receipt!
  useIndex: BigInt!
  blockNumber: BigInt!
}

type RevenueAllocation @entity(immutable: true) {
  "paymentId"
  id: ID!
  token: RightsToken!
  creator: Bytes!
  creatorAmount: BigInt!
  "Owner at settlement time (A-5) - does not follow later transfers"
  owner: Bytes!
  ownerAmount: BigInt!
  blockNumber: BigInt!
}

type LicenseEpochChange @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  token: RightsToken!
  newEpoch: BigInt!
  blockNumber: BigInt!
}

type Claim @entity(immutable: true) {
  "txHash-logIndex"
  id: ID!
  account: Bytes!
  "tinybar"
  amount: BigInt!
  blockNumber: BigInt!
}

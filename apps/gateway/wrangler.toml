# TrueCollective Access Gateway - Cloudflare Workers configuration (tasks.md T014)
name = "truecollective-gateway"
main = "src/index.ts"
# Newest date supported by the workerd bundled with @cloudflare/vitest-pool-workers 0.22 (bump together).
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Non-secret configuration. Secrets are set with `wrangler secret put` - see SECRETS.md.
[vars]
HEDERA_CHAIN_ID = "296"
HEDERA_RPC_URL = "https://testnet.hashio.io/api"
X402_FACILITATOR_URL = "https://api.testnet.blocky402.com"
PAYMENT_ASSET = "native"
# primary | fallback | custodial - fixed by the day1 probe (research.md R-2 / R-2a)
SETTLEMENT_MODE = "primary"
SUBGRAPH_URL = ""

# share_G ciphertext store (KEK-encrypted with packages/shared/src/kv-format.ts).
# Replace `id` with the output of `wrangler kv namespace create SHARE_G`.
[[kv_namespaces]]
binding = "SHARE_G"
id = "00000000000000000000000000000000"

# Postgres via Hyperdrive. Replace `id` with the output of `wrangler hyperdrive create`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000000000000000000000000000"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:5432/truecollective"

# Durable Objects: ReceiptLock serializes consume per receiptHash (R-3),
# OperatorTxQueue serializes operator-key nonce allocation (R-3a).
[durable_objects]
bindings = [
  { name = "RECEIPT_LOCK", class_name = "ReceiptLock" },
  { name = "OPERATOR_TX_QUEUE", class_name = "OperatorTxQueue" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReceiptLock", "OperatorTxQueue"]
